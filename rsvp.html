    <main id="rsvp">
        <div id="rsvp-content">
            <h1>Dejte nám vědět, zda dorazíte</h1>
            <form action="" id="rsvp-form">
                <div class="text-input">
                   <div class="rsvp-name">
                       <div class="rsvp-input text">
                           <label for="name" class="label">Jméno</label>
                           <div class="input-holder">
                               <input name="name" id="name" type="text" required="">
                               <div class="underline"></div>
                           </div>
                       </div>
                       <div class="rsvp-input text">
                           <label for="surname" class="label">Příjmení</label>
                           <div class="input-holder">
                               <input name="surname" id="surname" type="text" required="">
                               <div class="underline"></div>
                           </div>
                       </div>
                   </div>
                    <div class="rsvp-attendance">
                        <div class="rsvp-input text attendance">
                            <label for="adults" class="label">Počet dospělích: </label>
                            <div class="input-holder">
                                <input name="adults" id="adults" type="text" required="">
                            </div>
                        </div>
                        <div class="rsvp-input text attendance">
                            <label for="kids" class="label">Počet dětí: </label>
                            <div class="input-holder">
                                <input name="kids" id="kids" type="text" required="">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="rsvp-input checkbox">
                    <h3>Zúčastním se: </h3>
                    <div class="container">
                        <span class="checkbox-container">
                            <label for="ceremony">Obřadu</label>
                            <span class="custom-checkbox">
                                <input type="checkbox" name="ceremony" id="ceremony" checked>
                                <span class="check"></span>
                            </span>
                        </span>
                        <span class="checkbox-container">
                            <label for="feast">Hostiny</label>
                            <span class="custom-checkbox">
                                <input type="checkbox" name="feast" id="feast" checked>
                                <span class="check"></span>
                            </span>
                        </span>
                        <span class="checkbox-container">
                            <label for="party">Večerní Párty</label>
                            <span class="custom-checkbox">
                                <input type="checkbox" name="party" id="party" checked>
                                <span class="check"></span>
                            </span>
                        </span>
                        <span class="checkbox-container">
                            <label for="no-attendance">Nezúčastním se vůbec</label>
                            <span class="custom-checkbox">
                                <input type="checkbox" name="no-attendance" id="no-attendance">
                                <span class="check"> </span>
                            </span>
                        </span>
                    </div>
                </div>
            </form>
            <button id="submit">Odeslat</button>

            <h1>
                TĚŠÍME SE NA VÁS!
            </h1>

        </div>
